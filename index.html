<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#b9ddf5"><title>Моя деревня 0.08</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#b9ddf5}canvas{display:block;width:100%;height:100%;touch-action:none}#ui{position:absolute;inset:0;pointer-events:none}#title{position:absolute;left:12px;top:calc(env(safe-area-inset-top) + 12px);background:#ffffffec;border-radius:15px;padding:12px 15px;box-shadow:0 4px 15px #0002;max-width:75%;font-size:14px;color:#24482b}#title strong{display:block;font-size:18px;margin-bottom:3px}#buttons{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 20px);left:10px;right:10px;display:flex;justify-content:center;flex-wrap:wrap;gap:8px;pointer-events:auto}button{border:0;border-radius:12px;background:#fff;box-shadow:0 3px 10px #0002;padding:12px 13px;font-weight:700;color:#25513a;font-size:14px;min-height:45px}button.active{background:#317c4a;color:#fff}#status{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 12px);background:#fffe;padding:11px;border-radius:14px;color:#25482e;font-size:13px}#hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 132px);left:15px;right:15px;text-align:center;font-size:12px;color:#315b4a;text-shadow:0 1px #fff9;pointer-events:none}@media(max-width:410px){#title strong{font-size:16px}button{padding:10px;font-size:13px}#hint{bottom:calc(env(safe-area-inset-bottom) + 145px)}}</style></head><body><canvas id="view"></canvas><div id="ui"><div id="title"><strong>🌱 Моя деревня · 0.08</strong>3D-рельеф · озеро · река · овраг</div><div id="status">Рельеф и вода</div><div id="hint">☝️ Пальцем — поворот и наклон · двумя — масштаб</div><div id="buttons"><button id="terrain" class="active">🏞️ Рельеф</button><button id="flat">▱ Ровное поле</button><button id="water" class="active">💧 Вода: вкл</button><button id="left">↶</button><button id="right">↷</button><button id="minus">−</button><button id="plus">+</button><button id="reset">Сброс</button></div></div><script>
'use strict';
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d',{alpha:false});
const N=38, world=900;let yaw=-0.65,tilt=0.90,zoom=1,terrain=true,water=true,dirty=true,raf=false;
let w=0,h=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);invalidate()}
function invalidate(){dirty=true;if(!raf){raf=true;requestAnimationFrame(draw)}}
function gauss(x,z,cx,cz,sx,sz){let a=(x-cx)/sx,b=(z-cz)/sz;return Math.exp(-(a*a+b*b)*1.4)}
function lake(x,z){let a=(x+0.38)/0.23,b=(z+0.12)/0.22;return a*a+b*b<1}
function river(x,z){let center=0.29+0.09*Math.sin((z+0.2)*6);return Math.abs(x-center)<0.045+0.014*Math.sin(z*5)**2}
function elevation(x,z){if(!terrain)return 0;let hills=145*gauss(x,z,-0.12,-0.40,.28,.27)+110*gauss(x,z,.42,.08,.22,.32)+72*gauss(x,z,-.42,.45,.25,.22);let ravine=-105*Math.exp(-Math.pow((z-(.30*x+.22+.045*Math.sin(x*11)))/.10,2))*gauss(x,z,0,.19,.85,.70);let depression=-65*gauss(x,z,-.38,-.12,.28,.26);return hills+ravine+depression+8*Math.sin(x*11)*Math.cos(z*8)}
function project(x,y,z){const c=Math.cos(yaw),s=Math.sin(yaw),rx=x*c-z*s,rz=x*s+z*c;let scale=Math.min(w/1300,h/1120)*zoom;return [w*.5+rx*scale,h*.50+(rz*Math.sin(tilt)-y*Math.cos(tilt))*scale]}
function fill(poly,color){ctx.beginPath();ctx.moveTo(poly[0][0],poly[0][1]);for(let k=1;k<poly.length;k++)ctx.lineTo(poly[k][0],poly[k][1]);ctx.closePath();ctx.fillStyle=color;ctx.fill()}
function draw(){raf=false;if(!dirty)return;dirty=false;ctx.fillStyle='#b9ddf5';ctx.fillRect(0,0,w,h);let grad=ctx.createLinearGradient(0,0,0,h);grad.addColorStop(0,'#a8d5f2');grad.addColorStop(1,'#edf8ff');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
let tiles=[];for(let j=0;j<N;j++)for(let i=0;i<N;i++){let x0=-world/2+i*world/N,x1=x0+world/N,z0=-world/2+j*world/N,z1=z0+world/N;let p=[[x0,z0],[x1,z0],[x1,z1],[x0,z1]].map(([x,z])=>project(x,elevation(x/world*2,z/world*2),z));let mx=(x0+x1)/world,mz=(z0+z1)/world;let y=elevation(mx,mz),ys=elevation(mx+.03,mz),yz=elevation(mx,mz+.03);let shade=Math.max(-18,Math.min(18,(y-ys)*.27+(y-yz)*.17));let green=Math.round(159+shade+((i*13+j*7)%9));let red=Math.round(108+shade*.5),blue=Math.round(95+shade*.3);let isWater=water&&(lake(mx,mz)||river(mx,mz));let color=isWater?((i+j)%3===0?'#439cc7':'#53b1d5'):`rgb(${red},${green},${blue})`;let depth=((x0+x1)/2)*Math.sin(yaw)+((z0+z1)/2)*Math.cos(yaw);tiles.push({p,color,depth,water:isWater})}tiles.sort((a,b)=>a.depth-b.depth);for(let t of tiles){fill(t.p,t.color);ctx.strokeStyle=t.water?'#7dc8e288':'#ffffff13';ctx.lineWidth=.55;ctx.stroke()}
let corners=[[-450,-450],[450,-450],[450,450],[-450,450]].map(([x,z])=>project(x,elevation(x/450,z/450)-12,z));fill([corners[3],corners[2],corners[2].map((v,k)=>v+(k===1?9:0)),corners[3].map((v,k)=>v+(k===1?9:0))],'#467c37');}
function setButton(id,active){document.getElementById(id).classList.toggle('active',active)}
document.getElementById('terrain').onclick=()=>{terrain=true;setButton('terrain',true);setButton('flat',false);invalidate()};document.getElementById('flat').onclick=()=>{terrain=false;setButton('terrain',false);setButton('flat',true);invalidate()};document.getElementById('water').onclick=()=>{water=!water;setButton('water',water);document.getElementById('water').textContent=water?'💧 Вода: вкл':'💧 Вода: выкл';invalidate()};document.getElementById('left').onclick=()=>{yaw-=.22;invalidate()};document.getElementById('right').onclick=()=>{yaw+=.22;invalidate()};document.getElementById('minus').onclick=()=>{zoom=Math.max(.55,zoom/1.2);invalidate()};document.getElementById('plus').onclick=()=>{zoom=Math.min(3,zoom*1.2);invalidate()};document.getElementById('reset').onclick=()=>{yaw=-.65;tilt=.90;zoom=1;terrain=true;water=true;setButton('terrain',true);setButton('flat',false);setButton('water',true);document.getElementById('water').textContent='💧 Вода: вкл';invalidate()};
let pointers=new Map(),lastDist=0;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});lastDist=0});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){yaw+=(e.clientX-prev.x)*.009;tilt=Math.max(.20,Math.min(1.40,tilt+(e.clientY-prev.y)*.006))}else if(pointers.size===2){let a=[...pointers.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastDist)zoom=Math.max(.55,Math.min(3,zoom*dist/lastDist));lastDist=dist}invalidate()});for(let name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,e=>{pointers.delete(e.pointerId);lastDist=0});window.addEventListener('resize',resize);resize();
</script></body></html>
