<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#b8d8ef"><title>Моя деревня — 3D поле</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,Arial,sans-serif;background:#b8d8ef;touch-action:none}#scene{position:fixed;inset:0;perspective:850px;perspective-origin:50% 43%;overflow:hidden;background:linear-gradient(#a5d2f1,#e6f3fb 75%)}#world{position:absolute;left:50%;top:55%;width:740px;height:740px;transform-style:preserve-3d;transform:translate(-50%,-50%) rotateX(61deg) rotateZ(-27deg) scale(.9);will-change:transform}#field{position:absolute;inset:0;background-color:#77b953;background-image:linear-gradient(#ffffff2b 1px,transparent 1px),linear-gradient(90deg,#ffffff2b 1px,transparent 1px),repeating-linear-gradient(45deg,#79ba55 0 24px,#7fbe5c 24px 48px);background-size:37px 37px,37px 37px,100% 100%;border:5px solid #568f3e;box-shadow:0 0 0 2px #436f30,0 20px 0 #487b34,0 32px 38px #385b3d77;backface-visibility:visible}#hud{position:fixed;top:env(safe-area-inset-top,12px);left:12px;right:12px;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}.pill{background:#fffffff0;border-radius:16px;padding:10px 14px;box-shadow:0 3px 12px #4565;font-size:14px}.pill strong{display:block;font-size:17px}#controls{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:12px;right:12px;z-index:3;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button{border:0;border-radius:12px;background:#fff;padding:13px 16px;font-size:16px;font-weight:650;color:#24442a;box-shadow:0 2px 10px #3455;touch-action:manipulation}button:active{background:#dcefd5}#status{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);left:10px;right:10px;text-align:center;color:#1c3b30;font-size:13px;pointer-events:none}#error{position:fixed;top:75px;left:12px;right:12px;background:#fff0e6;color:#812b19;padding:8px;border-radius:10px;display:none;z-index:4}</style></head><body><main id="scene"><div id="world"><div id="field"></div></div></main><header id="hud"><div class="pill"><strong>🌱 Моя деревня · 0.06</strong>3D-поле · проверка управления</div><div class="pill" id="angles">61° / −27°</div></header><div id="error"></div><div id="status">Проведи пальцем по полю · двумя пальцами измени масштаб</div><nav id="controls"><button type="button" id="left">↶ Повернуть</button><button type="button" id="right">Повернуть ↷</button><button type="button" id="plus">＋</button><button type="button" id="minus">－</button><button type="button" id="reset">Сброс</button></nav><script>(function(){'use strict';var world=document.getElementById('world'),label=document.getElementById('angles');var x=61,z=-27,scale=.9,drag=false,lastX=0,lastY=0,lastDist=0;function clamp(v,min,max){return Math.max(min,Math.min(max,v))}function draw(){world.style.transform='translate(-50%,-50%) rotateX('+x+'deg) rotateZ('+z+'deg) scale('+scale+')';label.textContent=Math.round(x)+'° / '+Math.round(z)+'°'}function dist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}document.getElementById('left').onclick=function(){z-=20;draw()};document.getElementById('right').onclick=function(){z+=20;draw()};document.getElementById('plus').onclick=function(){scale=clamp(scale*1.2,.35,2);draw()};document.getElementById('minus').onclick=function(){scale=clamp(scale/1.2,.35,2);draw()};document.getElementById('reset').onclick=function(){x=61;z=-27;scale=.9;draw()};var scene=document.getElementById('scene');scene.addEventListener('touchstart',function(e){if(e.touches.length===1){drag=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY}else if(e.touches.length===2){drag=false;lastDist=dist(e.touches)}},{passive:true});scene.addEventListener('touchmove',function(e){e.preventDefault();if(e.touches.length===2){var d=dist(e.touches);if(lastDist)scale=clamp(scale*d/lastDist,.35,2);lastDist=d;draw()}else if(e.touches.length===1&&drag){var t=e.touches[0];z+=(t.clientX-lastX)*.35;x=clamp(x-(t.clientY-lastY)*.25,15,83);lastX=t.clientX;lastY=t.clientY;draw()}},{passive:false});scene.addEventListener('touchend',function(){drag=false;lastDist=0});scene.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse'){drag=true;lastX=e.clientX;lastY=e.clientY}});window.addEventListener('pointermove',function(e){if(drag&&e.pointerType==='mouse'){z+=(e.clientX-lastX)*.35;x=clamp(x-(e.clientY-lastY)*.25,15,83);lastX=e.clientX;lastY=e.clientY;draw()}});window.addEventListener('pointerup',function(){drag=false});window.addEventListener('wheel',function(e){scale=clamp(scale*(e.deltaY<0?1.1:.9),.35,2);draw()},{passive:true});draw()})();</script></body></html>
