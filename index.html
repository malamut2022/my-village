<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#b7ddf2"><title>Моя деревня 0.09</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#b8ddf4;color:#20452c}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;top:env(safe-area-inset-top,12px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:start;gap:8px;pointer-events:none}.panel{background:#fffffff0;border-radius:16px;padding:11px 13px;box-shadow:0 3px 12px #476b7720;pointer-events:auto}.name{font-weight:750;font-size:18px}.sub{font-size:12px;margin-top:3px}.status{font-size:12px;max-width:150px;text-align:right}.controls{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:8px;right:8px;display:flex;flex-direction:column;gap:7px;align-items:center}.line{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}button{border:0;border-radius:12px;padding:11px 12px;font-size:14px;font-weight:650;color:#244b2d;background:#fffffff0;box-shadow:0 2px 7px #4e748c22;min-height:42px}button.active{background:#287b49;color:white}button:active{transform:scale(.97)}.hint{font-size:12px;text-align:center;background:#ffffffd9;padding:7px 10px;border-radius:10px;max-width:98vw}.tiny{font-size:12px;padding:9px 11px}@media(max-width:390px){button{font-size:12px;padding:9px}.name{font-size:16px}.sub{font-size:11px}}</style></head><body><canvas id="scene"></canvas><div class="hud"><div class="panel"><div class="name">🌱 Моя деревня · 0.09</div><div class="sub">Редактор земли · лес · озеро · река</div></div><div class="panel status" id="status">Камера</div></div><div class="controls"><div class="hint" id="hint">☝️ Пальцем — поворот · двумя — масштаб</div><div class="line"><button id="cam" class="active">🎮 Камера</button><button id="up">⛰ Поднять</button><button id="down">🏞 Опустить</button><button id="plant">🌳 Посадить</button><button id="erase">🪓 Убрать</button></div><div class="line"><button id="forest">🌲 Посадить лес</button><button id="water" class="active">💧 Вода: вкл</button><button id="terrain" class="active">Рельеф: вкл</button><button id="minus" class="tiny">−</button><button id="plus" class="tiny">+</button><button id="reset" class="tiny">Сброс</button></div></div><script>
(()=>{'use strict';const c=document.getElementById('scene'),ctx=c.getContext('2d',{alpha:false});const N=40, S=2, grid=N+1;let heights=new Float32Array(grid*grid),trees=[],showWater=true,showTerrain=true,mode='cam',yaw=.66,pitch=.80,zoom=1,dirty=true,W=0,H=0,dpr=1;const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const idx=(x,z)=>z*grid+x;const gauss=(x,z,cx,cz,sx,sz)=>Math.exp(-((x-cx)**2/(sx*sx)+(z-cz)**2/(sz*sz))*1.8);const river=x=>21+5*Math.sin(x*.17+.2)+2*Math.sin(x*.42);const waterAt=(x,z)=>Math.abs(z-river(x))<1.0 || ((x-12)**2/20+(z-28)**2/13<1);function init(){for(let z=0;z<=N;z++)for(let x=0;x<=N;x++){let h=6*gauss(x,z,24,17,8,7)+4.6*gauss(x,z,10,12,6,6)+2.5*gauss(x,z,32,30,8,8)-5.3*gauss(x,z,20,24,6,5)-2.5*gauss(x,z,14,29,6,5);heights[idx(x,z)]=h}trees=[];let seed=17;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}for(let i=0;i<130;i++){let x=1+rnd()*38,z=1+rnd()*38;if(!waterAt(x,z)&&((x<13&&z<20)||(x>29&&z<29)||(x>22&&z>30)))trees.push({x,z,s:.7+rnd()*.7,t:rnd()>.35?1:0})}dirty=true}init();function height(x,z){if(!showTerrain)return 0;let ix=clamp(Math.floor(x),0,N-1),iz=clamp(Math.floor(z),0,N-1),a=clamp(x-ix,0,1),b=clamp(z-iz,0,1),h00=heights[idx(ix,iz)],h10=heights[idx(ix+1,iz)],h01=heights[idx(ix,iz+1)],h11=heights[idx(ix+1,iz+1)];return (h00*(1-a)+h10*a)*(1-b)+(h01*(1-a)+h11*a)*b}function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);dirty=true}addEventListener('resize',resize);resize();function proj(x,y,z){let X=x-N/2,Z=z-N/2,co=Math.cos(yaw),si=Math.sin(yaw),rx=X*co-Z*si,rz=X*si+Z*co;let scale=Math.min(W/63,H/79)*zoom;return [W/2+rx*scale,H*.47+(rz*Math.sin(pitch)-y*1.65*Math.cos(pitch))*scale]}function poly(points,fill,stroke){ctx.beginPath();ctx.moveTo(...points[0]);for(let i=1;i<points.length;i++)ctx.lineTo(...points[i]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.55;ctx.stroke()}}function render(){if(!dirty)return;dirty=false;ctx.fillStyle='#b8def7';ctx.fillRect(0,0,W,H);let cells=[];for(let z=0;z<N;z++)for(let x=0;x<N;x++){let h=(height(x,z)+height(x+1,z)+height(x,z+1)+height(x+1,z+1))/4,rx=x+0.5-N/2,rz=z+0.5-N/2,depth=rx*Math.sin(yaw)+rz*Math.cos(yaw);cells.push({x,z,h,depth})}cells.sort((a,b)=>a.depth-b.depth);for(const {x,z,h} of cells){let p=[proj(x,height(x,z),z),proj(x+1,height(x+1,z),z),proj(x+1,height(x+1,z+1),z+1),proj(x,height(x,z+1),z+1)];let w=showWater&&waterAt(x+.5,z+.5);let bright=clamp(Math.round(130+h*2.4),105,170);poly(p,w?'#4da9d9':`rgb(${Math.round(bright*.65)},${bright+54},${Math.round(bright*.57)})`,w?'#75c2e4':'#ffffff29')} // tree canopy is deliberately stylized and lightweight
const sorted=trees.slice().sort((a,b)=>((a.x-N/2)*Math.sin(yaw)+(a.z-N/2)*Math.cos(yaw))-((b.x-N/2)*Math.sin(yaw)+(b.z-N/2)*Math.cos(yaw)));for(const t of sorted){let p=proj(t.x,height(t.x,t.z)+.15,t.z),k=Math.min(W/63,H/79)*zoom*t.s;ctx.fillStyle='#6d5634';ctx.fillRect(p[0]-k*.13,p[1]-k*1.9,k*.26,k*1.9);if(t.t){ctx.fillStyle='#236c3a';ctx.beginPath();ctx.moveTo(p[0],p[1]-k*5.1);ctx.lineTo(p[0]-k*1.6,p[1]-k*.9);ctx.lineTo(p[0]+k*1.6,p[1]-k*.9);ctx.closePath();ctx.fill();ctx.fillStyle='#2e8846';ctx.beginPath();ctx.moveTo(p[0],p[1]-k*4.2);ctx.lineTo(p[0]-k*1.3,p[1]-k*1.5);ctx.lineTo(p[0]+k*1.3,p[1]-k*1.5);ctx.fill()}else{ctx.fillStyle='#357d36';ctx.beginPath();ctx.arc(p[0],p[1]-k*3,k*1.65,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4e9945';ctx.beginPath();ctx.arc(p[0]-k*.35,p[1]-k*3.45,k*1.03,0,Math.PI*2);ctx.fill()}}}function refresh(){document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('active'));$(mode).classList.add('active');$('water').classList.toggle('active',showWater);$('terrain').classList.toggle('active',showTerrain);$('water').textContent='💧 Вода: '+(showWater?'вкл':'выкл');$('terrain').textContent='Рельеф: '+(showTerrain?'вкл':'выкл');const names={cam:'Камера',up:'Поднять землю',down:'Опустить землю',plant:'Посадить дерево',erase:'Убрать дерево'};$('status').textContent=names[mode]+' · деревьев: '+trees.length;$('hint').textContent=mode==='cam'?'☝️ Пальцем — поворот · двумя — масштаб':mode==='plant'?'Коснись земли, чтобы посадить дерево':mode==='erase'?'Коснись дерева, чтобы удалить его':'Проведи пальцем по земле, чтобы изменить высоту';dirty=true}['cam','up','down','plant','erase'].forEach(id=>$(id).onclick=()=>{mode=id;refresh()});$('water').onclick=()=>{showWater=!showWater;refresh()};$('terrain').onclick=()=>{showTerrain=!showTerrain;refresh()};$('plus').onclick=()=>{zoom=clamp(zoom*1.2,.45,2.6);dirty=true};$('minus').onclick=()=>{zoom=clamp(zoom/1.2,.45,2.6);dirty=true};$('reset').onclick=()=>{if(confirm('Вернуть исходный ландшафт и деревья?')){init();mode='cam';showTerrain=true;showWater=true;refresh()}};$('forest').onclick=()=>{let n=0;for(let z=3;z<N-2;z+=2.3)for(let x=3;x<N-2;x+=2.3){if((x<16&&z<18)||(x>28&&z>24)){if(!waterAt(x,z)&&!trees.some(t=>(t.x-x)**2+(t.z-z)**2<2)){trees.push({x,z,s:.8+(x%3)*.12,t:(x+z)%3>1?1:0});n++}}}refresh();$('status').textContent='Добавлено деревьев: '+n};function locate(px,py){let best=null,d=Infinity;for(let z=0;z<=N;z++)for(let x=0;x<=N;x++){let p=proj(x,height(x,z),z),dd=(p[0]-px)**2+(p[1]-py)**2;if(dd<d){d=dd;best={x,z}}}return d<2500?best:null}function edit(px,py){let q=locate(px,py);if(!q)return;if(mode==='up'||mode==='down'){for(let z=Math.max(0,q.z-3);z<=Math.min(N,q.z+3);z++)for(let x=Math.max(0,q.x-3);x<=Math.min(N,q.x+3);x++){let d=Math.hypot(x-q.x,z-q.z);if(d<3)heights[idx(x,z)]=clamp(heights[idx(x,z)]+(mode==='up'?.35:-.35)*(1-d/3),-9,16)}}else if(mode==='plant'){if(!waterAt(q.x,q.z)&&!trees.some(t=>(t.x-q.x)**2+(t.z-q.z)**2<2))trees.push({x:q.x,z:q.z,s:1,t:Math.random()>.4?1:0})}else if(mode==='erase'){let i=-1,d=100;trees.forEach((t,j)=>{let v=(t.x-q.x)**2+(t.z-q.z)**2;if(v<d){d=v;i=j}});if(i>=0&&d<12)trees.splice(i,1)}refresh()}let pointers=new Map(),lastPinch=0,lastEdit=0;function point(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);pointers.set(e.pointerId,point(e));if(mode!=='cam'&&pointers.size===1)edit(e.clientX-c.getBoundingClientRect().left,e.clientY-c.getBoundingClientRect().top)});c.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let p=point(e),old=pointers.get(e.pointerId);pointers.set(e.pointerId,p);if(pointers.size===2){let ps=[...pointers.values()],dist=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);if(lastPinch)zoom=clamp(zoom*dist/lastPinch,.45,2.6);lastPinch=dist;dirty=true;return}lastPinch=0;if(mode==='cam'){yaw+=(p.x-old.x)*.009;pitch=clamp(pitch+(p.y-old.y)*.007,.22,1.48);dirty=true}else if((mode==='up'||mode==='down')&&performance.now()-lastEdit>35){edit(p.x,p.y);lastEdit=performance.now()}});function end(e){pointers.delete(e.pointerId);lastPinch=0}c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);refresh();function frame(){render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();</script></body></html>
