<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#b9dcf5"><title>Моя деревня 0.07.1 — исправленный 3D-рельеф</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(#a9d4f3,#e8f4fc);color:#173b25}#scene{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}header{position:absolute;top:max(16px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}.panel{background:#fffffff0;border-radius:17px;padding:12px 15px;box-shadow:0 4px 18px #20403020}.title{font-weight:800;font-size:18px}.subtitle{font-size:12px;margin-top:4px}.angle{font-size:13px;white-space:nowrap}.bottom{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:10px;right:10px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;pointer-events:auto}button{appearance:none;border:0;background:#fff;color:#275334;border-radius:13px;padding:12px 13px;font-size:14px;font-weight:700;box-shadow:0 3px 12px #29462b2b;min-height:43px}button.active{background:#377d47;color:white}.help{background:#ffffffdd;border-radius:10px;padding:7px 11px;text-align:center;font-size:11px;max-width:98%}#fallback{position:absolute;left:10%;top:37%;width:80%;height:32%;background:#8bc866;transform:perspective(600px) rotateX(52deg) rotateZ(-18deg);box-shadow:0 12px #4d8e40;pointer-events:none}body.ready #fallback{display:none}@media(max-width:380px){button{padding:10px;font-size:12px}.title{font-size:16px}}
</style></head><body><div id="fallback"></div><canvas id="scene" aria-label="Трёхмерный рельеф деревни"></canvas><header><div class="panel"><div class="title">🌱 Моя деревня · 0.07.1</div><div class="subtitle">3D-рельеф · холмы, низины, овраг</div></div><div class="panel angle" id="status">3D-карта</div></header><div class="bottom"><div class="buttons"><button id="hills" class="active">🏞 Рельеф</button><button id="flat">▱ Ровное поле</button><button id="left">↶</button><button id="right">↷</button><button id="minus">−</button><button id="plus">+</button><button id="reset">Сброс</button></div><div class="help">☝️ Пальцем — поворот и наклон · двумя пальцами — масштаб</div></div><script>
(function(){'use strict';const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:true});if(!ctx)return;const status=document.getElementById('status');let W=0,H=0,dpr=1,az=-0.72,elev=.95,zoom=1,mode='hills';const N=42,S=22;let verts=[],tris=[];const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function height(x,z){const hill=(cx,cz,rx,rz,h)=>h*Math.exp(-(((x-cx)/rx)**2+((z-cz)/rz)**2)*1.6);let y=hill(-.38,-.2,.42,.42,3.1)+hill(.40,.35,.33,.38,2.6)-hill(.12,-.45,.34,.27,1.4);let trench=Math.exp(-(((x-(.07+.10*Math.sin(z*5)))/.105)**2))*(.9+.35*Math.cos(z*3));y-=trench*2.35;return y}function build(){verts=[];tris=[];for(let j=0;j<=N;j++)for(let i=0;i<=N;i++){let x=(i/N-.5)*S,z=(j/N-.5)*S;verts.push([x,mode==='flat'?0:height(x/(S/2),z/(S/2)),z])}for(let j=0;j<N;j++)for(let i=0;i<N;i++){let a=j*(N+1)+i,b=a+1,c=a+N+1,d=c+1;tris.push([a,c,b],[b,c,d])}}function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);draw()}function project(v){const [x,y,z]=v;let ca=Math.cos(az),sa=Math.sin(az);let xx=x*ca-z*sa,zz=x*sa+z*ca;let yy=y*Math.cos(elev)-zz*Math.sin(elev),depth=y*Math.sin(elev)+zz*Math.cos(elev);let sc=Math.min(W/31,H/28)*zoom;return [W/2+xx*sc,H*.51-yy*sc,depth]}function draw(){if(!W)return;ctx.clearRect(0,0,W,H);const pts=verts.map(project);let ordered=tris.map(t=>{let a=pts[t[0]],b=pts[t[1]],c=pts[t[2]];let va=verts[t[0]],vb=verts[t[1]],vc=verts[t[2]];let dx1=vb[0]-va[0],dy1=vb[1]-va[1],dz1=vb[2]-va[2],dx2=vc[0]-va[0],dy2=vc[1]-va[1],dz2=vc[2]-va[2];let nx=dy1*dz2-dz1*dy2,ny=dz1*dx2-dx1*dz2,nz=dx1*dy2-dy1*dx2;let l=Math.hypot(nx,ny,nz)||1;let light=clamp(.78+(.25*nx+.78*ny+.35*nz)/l*.27,.53,1.12);let avg=(va[1]+vb[1]+vc[1])/3;let hue=mode==='flat'?99:avg<-.7?88:avg>1.6?95:105;let sat=avg<-.7?32:47;let lum=clamp((avg<-.7?41:avg>1.8?51:47)*light,26,65);return {a,b,c,depth:(a[2]+b[2]+c[2])/3,fill:`hsl(${hue} ${sat}% ${lum}%)`}});ordered.sort((a,b)=>b.depth-a.depth);ctx.lineJoin='round';for(const t of ordered){ctx.beginPath();ctx.moveTo(t.a[0],t.a[1]);ctx.lineTo(t.b[0],t.b[1]);ctx.lineTo(t.c[0],t.c[1]);ctx.closePath();ctx.fillStyle=t.fill;ctx.fill();ctx.strokeStyle='#366c3440';ctx.lineWidth=.42;ctx.stroke()}status.textContent=Math.round(elev*180/Math.PI)+'° / '+Math.round(az*180/Math.PI)+'°';document.body.classList.add('ready')}
function update(){draw()}document.getElementById('left').onclick=()=>{az-=.18;update()};document.getElementById('right').onclick=()=>{az+=.18;update()};document.getElementById('plus').onclick=()=>{zoom=clamp(zoom*1.18,.45,2.4);update()};document.getElementById('minus').onclick=()=>{zoom=clamp(zoom/1.18,.45,2.4);update()};document.getElementById('reset').onclick=()=>{az=-.72;elev=.95;zoom=1;update()};function setMode(m){mode=m;document.getElementById('hills').classList.toggle('active',m==='hills');document.getElementById('flat').classList.toggle('active',m==='flat');build();draw()}document.getElementById('hills').onclick=()=>setMode('hills');document.getElementById('flat').onclick=()=>setMode('flat');let pointers=new Map(),oldDistance=0;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);oldDistance=0});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let old=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1){az+=(e.clientX-old[0])*.009;elev=clamp(elev+(e.clientY-old[1])*.006,.28,1.48);draw()}else if(pointers.size===2){let p=[...pointers.values()],dist=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);if(oldDistance)zoom=clamp(zoom*dist/oldDistance,.45,2.4);oldDistance=dist;draw()}});function end(e){pointers.delete(e.pointerId);oldDistance=0}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom*Math.exp(-e.deltaY*.001),.45,2.4);draw()},{passive:false});window.addEventListener('resize',resize);build();resize();})();
</script></body></html>
